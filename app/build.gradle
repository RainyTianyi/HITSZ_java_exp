plugins {
    id 'com.android.application'
}

android {
    namespace 'edu.hitsz.android'
    compileSdk 36

    defaultConfig {
        applicationId 'edu.hitsz.android.aircraftwar'
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
